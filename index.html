<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover">
    <meta name="theme-color" content="#FF6600">
    <title>شركة الجبل لصناعة البي في سي والألومنيوم | Al-Jabal PVC & Aluminum Industry Co.</title>
    
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Cairo:wght@300;400;500;600;700;800;900&family=Cormorant+Garamond:wght@400;500;600;700&family=Lato:wght@300;400;700;900&display=swap" rel="stylesheet">
    
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">

    <style>
        /* =========================================
           CSS VARIABLES
           ========================================= */
        :root {
            --logo-black: #000000;
            --logo-sun-yellow: #FFD700;
            --logo-sun-orange: #FF6600;
            --logo-sun-gradient: linear-gradient(180deg, #FFD700 0%, #FF6600 100%);

            --bg-primary: #FAFAF8;
            --bg-secondary: #FFFFFF;
            --bg-tertiary: #F5F3EF;
            --bg-dark: #111111;
            --bg-dark-secondary: #1A1A1A;
            
            --text-primary: #111111;
            --text-secondary: #555555;
            --text-light: #888888;
            --text-on-dark: #FFFFFF;
            --text-on-dark-secondary: #CCCCCC;
            
            --brand-orange: #FF6600;
            --brand-yellow: #FFD700;
            --brand-black: #000000;
            
            --accent: #FF6600;
            --accent-hover: #E65C00;
            --accent-light: rgba(255, 102, 0, 0.08);
            --accent-border: rgba(255, 102, 0, 0.2);
            
            --border-color: #E5E5E5;
            --border-light: #F0F0F0;
            
            --glass-bg: rgba(255, 255, 255, 0.75);
            --glass-border: rgba(255, 255, 255, 0.6);
            --glass-shadow: 0 4px 20px rgba(0, 0, 0, 0.06);
            --glass-blur: blur(16px) saturate(160%);
            
            --header-bg: rgba(250, 250, 248, 0.88);
            --header-bg-scrolled: rgba(250, 250, 248, 0.98);
            
            --card-shadow: 0 2px 12px rgba(0, 0, 0, 0.05);
            --card-shadow-hover: 0 12px 32px rgba(0, 0, 0, 0.1);
            
            --header-height: 82px;
            --header-height-scrolled: 70px;
            
            --transition: all 0.35s cubic-bezier(0.25, 0.46, 0.45, 0.94);
        }

        [data-theme="dark"] {
            --bg-primary: #0A0A0A;
            --bg-secondary: #151515;
            --bg-tertiary: #1E1E1E;
            --bg-dark: #000000;
            --bg-dark-secondary: #0A0A0A;
            
            --text-primary: #FAFAF8;
            --text-secondary: #B0B0B0;
            --text-light: #777777;
            --text-on-dark: #FFFFFF;
            --text-on-dark-secondary: #CCCCCC;
            
            --accent: #FF8C00;
            --accent-hover: #FFD700;
            --accent-light: rgba(255, 140, 0, 0.1);
            --accent-border: rgba(255, 140, 0, 0.25);
            
            --border-color: #2A2A2A;
            --border-light: #1E1E1E;
            
            --glass-bg: rgba(21, 21, 21, 0.75);
            --glass-border: rgba(255, 255, 255, 0.08);
            --glass-shadow: 0 4px 20px rgba(0, 0, 0, 0.3);
            
            --header-bg: rgba(10, 10, 10, 0.88);
            --header-bg-scrolled: rgba(10, 10, 10, 0.98);
            
            --card-shadow: 0 2px 12px rgba(0, 0, 0, 0.3);
            --card-shadow-hover: 0 12px 32px rgba(0, 0, 0, 0.5);
        }

        /* =========================================
           GLOBAL RESET & TYPOGRAPHY
           ========================================= */
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }

        html {
            scroll-behavior: smooth;
            -webkit-font-smoothing: antialiased;
            -moz-osx-font-smoothing: grayscale;
            overflow-x: hidden;
            -webkit-text-size-adjust: 100%;
        }

        body {
            font-family: 'Cairo', 'Lato', sans-serif;
            background-color: var(--bg-primary);
            color: var(--text-primary);
            line-height: 1.7;
            transition: background-color 0.5s ease, color 0.5s ease;
            overflow-x: hidden;
            -webkit-tap-highlight-color: transparent;
            padding-top: env(safe-area-inset-top, 0);
        }

        body[dir="ltr"] {
            font-family: 'Lato', 'Cairo', sans-serif;
        }

        h1, h2, h3, h4, h5, h6 {
            font-family: 'Cormorant Garamond', 'Cairo', serif;
            font-weight: 700;
            line-height: 1.2;
            color: var(--text-primary);
        }

        a {
            text-decoration: none;
            color: inherit;
            transition: var(--transition);
        }

        ul { list-style: none; }

        img {
            max-width: 100%;
            height: auto;
            display: block;
        }

        button {
            font-family: inherit;
            -webkit-tap-highlight-color: transparent;
        }

        .container {
            max-width: 1360px;
            margin: 0 auto;
            padding: 0 2.5rem;
            width: 100%;
        }

        @media (max-width: 768px) {
            .container { padding: 0 1rem; }
        }

        @media (max-width: 480px) {
            .container { padding: 0 0.875rem; }
        }

        /* =========================================
           UTILITY CLASSES
           ========================================= */
        .section-padding { padding: 7rem 0; }

        @media (max-width: 768px) {
            .section-padding { padding: 4rem 0; }
        }

        .gold-line {
            width: 60px;
            height: 3px;
            background: var(--logo-sun-gradient);
            margin-bottom: 1.5rem;
            border-radius: 3px;
        }

        .section-title {
            font-size: clamp(1.6rem, 4.5vw, 3rem);
            margin-bottom: 0.5rem;
            color: var(--text-primary);
            letter-spacing: -0.5px;
            font-weight: 800;
        }

        .section-subtitle {
            font-size: clamp(0.85rem, 1.4vw, 1.05rem);
            color: var(--text-secondary);
            margin-bottom: 3rem;
            font-weight: 400;
            letter-spacing: 0.5px;
        }

        /* =========================================
           BUTTONS
           ========================================= */
        .btn {
            display: inline-flex;
            align-items: center;
            justify-content: center;
            gap: 0.5rem;
            padding: 0.95rem 2rem;
            font-size: 0.88rem;
            font-weight: 700;
            border: 1.5px solid transparent;
            cursor: pointer;
            transition: var(--transition);
            text-align: center;
            border-radius: 6px;
            letter-spacing: 0.3px;
            position: relative;
            font-family: 'Cairo', sans-serif;
            -webkit-tap-highlight-color: transparent;
        }

        .btn i { transition: transform 0.25s ease; font-size: 0.85em; }
        .btn:hover i { transform: translateX(-3px); }
        body[dir="ltr"] .btn:hover i { transform: translateX(3px); }

        .btn-primary {
            background: var(--brand-orange);
            color: #FFFFFF;
            border-color: var(--brand-orange);
            font-weight: 700;
        }

        .btn-primary:hover {
            background: var(--accent-hover);
            border-color: var(--accent-hover);
            transform: translateY(-1px);
        }

        .btn-outline {
            background-color: transparent;
            color: var(--text-primary);
            border-color: var(--border-color);
        }

        .btn-outline:hover {
            border-color: var(--brand-orange);
            color: var(--brand-orange);
            background-color: var(--accent-light);
        }

        .btn-outline-light {
            background-color: transparent;
            color: #FFFFFF;
            border-color: rgba(255,255,255,0.6);
        }

        .btn-outline-light:hover {
            border-color: #FFFFFF;
            background-color: rgba(255, 255, 255, 0.1);
        }

        /* =========================================
           HEADER
           ========================================= */
        header {
            position: fixed;
            top: 0;
            left: 0;
            right: 0;
            width: 100%;
            z-index: 1000;
            background-color: var(--header-bg);
            backdrop-filter: var(--glass-blur);
            -webkit-backdrop-filter: var(--glass-blur);
            border-bottom: 1px solid var(--border-light);
            transition: var(--transition);
        }

        header.scrolled {
            background-color: var(--header-bg-scrolled);
            border-bottom: 1px solid var(--border-color);
            box-shadow: 0 2px 12px rgba(0, 0, 0, 0.06);
        }

        .header-inner {
            display: flex;
            justify-content: space-between;
            align-items: center;
            height: var(--header-height);
            transition: height 0.35s ease;
            gap: 1rem;
            min-width: 0;
        }

        header.scrolled .header-inner { height: var(--header-height-scrolled); }

        .logo {
            display: flex;
            align-items: center;
            gap: 0.7rem;
            text-decoration: none;
            flex-shrink: 1;
            min-width: 0;
            padding: 4px 0;
        }

        .logo img {
            height: 54px;
            width: auto;
            max-width: 54px;
            object-fit: contain;
            flex-shrink: 0;
            transition: height 0.35s ease;
        }

        header.scrolled .logo img { height: 44px; max-width: 44px; }

        .logo-text {
            display: flex;
            flex-direction: column;
            line-height: 1.15;
            min-width: 0;
        }

        .logo-text .brand-name {
            font-family: 'Cairo', sans-serif;
            font-size: 0.98rem;
            font-weight: 800;
            color: var(--text-primary);
            letter-spacing: 0.2px;
            transition: font-size 0.35s ease;
            white-space: nowrap;
            overflow: hidden;
            text-overflow: ellipsis;
            max-width: 280px;
        }

        header.scrolled .logo-text .brand-name { font-size: 0.9rem; }

        .logo-text .brand-sub {
            font-family: 'Lato', sans-serif;
            font-size: 0.58rem;
            font-weight: 700;
            color: var(--brand-orange);
            letter-spacing: 1.5px;
            margin-top: 2px;
            white-space: nowrap;
        }

        header.scrolled .logo-text .brand-sub { font-size: 0.54rem; }

        .nav-links {
            display: flex;
            gap: 1.6rem;
            align-items: center;
            flex-shrink: 0;
        }

        .nav-links a {
            font-size: 0.86rem;
            font-weight: 600;
            color: var(--text-secondary);
            position: relative;
            letter-spacing: 0.2px;
            padding: 0.5rem 0;
            white-space: nowrap;
        }

        .nav-links a:hover { color: var(--brand-orange); }

        .nav-links a::after {
            content: '';
            position: absolute;
            bottom: 0;
            right: 0;
            width: 0;
            height: 2px;
            background: var(--brand-orange);
            border-radius: 2px;
            transition: width 0.3s ease;
        }

        .nav-links a:hover::after { width: 100%; }

        .header-actions {
            display: flex;
            gap: 0.4rem;
            align-items: center;
            flex-shrink: 0;
        }

        .icon-btn {
            background: transparent;
            border: 1.5px solid var(--border-color);
            color: var(--text-primary);
            width: 40px;
            height: 40px;
            border-radius: 8px;
            cursor: pointer;
            display: flex;
            align-items: center;
            justify-content: center;
            transition: var(--transition);
            font-size: 0.9rem;
            flex-shrink: 0;
            padding: 0;
        }

        .icon-btn:hover {
            border-color: var(--brand-orange);
            color: var(--brand-orange);
            background-color: var(--accent-light);
        }

        .lang-btn {
            font-size: 0.72rem;
            font-weight: 800;
            width: auto;
            padding: 0 0.9rem;
            border-radius: 8px;
            gap: 0.35rem;
        }

        .hamburger {
            display: none;
            flex-direction: column;
            gap: 5px;
            cursor: pointer;
            background: none;
            border: none;
            padding: 9px;
            flex-shrink: 0;
            border-radius: 8px;
            transition: var(--transition);
        }

        .hamburger:hover { background: var(--accent-light); }

        .hamburger span {
            display: block;
            width: 22px;
            height: 2px;
            background-color: var(--text-primary);
            transition: var(--transition);
            border-radius: 2px;
        }

        /* =========================================
           RESPONSIVE HEADER
           ========================================= */
        @media (max-width: 1200px) {
            .nav-links { gap: 1.1rem; }
            .nav-links a { font-size: 0.8rem; }
            .logo-text .brand-name { font-size: 0.9rem; max-width: 240px; }
        }

        @media (max-width: 992px) {
            :root {
                --header-height: 72px;
                --header-height-scrolled: 64px;
            }
            
            .nav-links { display: none; }
            .hamburger { display: flex; }
            
            .header-actions .lang-btn span { display: none; }
            .header-actions .lang-btn {
                width: 40px;
                height: 40px;
                padding: 0;
                border-radius: 8px;
            }
            
            .logo-text .brand-name { font-size: 0.92rem; max-width: 240px; }
        }

        @media (max-width: 768px) {
            :root {
                --header-height: 68px;
                --header-height-scrolled: 60px;
            }
            
            .header-inner { gap: 0.5rem; }
            
            .logo { gap: 0.55rem; }
            .logo img { height: 48px; max-width: 48px; }
            header.scrolled .logo img { height: 42px; max-width: 42px; }
            
            .logo-text .brand-name {
                font-size: 0.82rem;
                max-width: 170px;
            }
            header.scrolled .logo-text .brand-name { font-size: 0.78rem; }
            
            .logo-text .brand-sub {
                font-size: 0.5rem;
                letter-spacing: 1px;
            }
            
            .header-actions { gap: 0.3rem; }
            .icon-btn {
                width: 36px;
                height: 36px;
                font-size: 0.82rem;
                border-radius: 7px;
            }
            .lang-btn { width: 36px; height: 36px; }
            
            .hamburger { padding: 7px; }
            .hamburger span { width: 20px; height: 2px; }
        }

        @media (max-width: 480px) {
            :root {
                --header-height: 64px;
                --header-height-scrolled: 58px;
            }
            
            .logo { gap: 0.45rem; }
            .logo img { height: 44px; max-width: 44px; }
            header.scrolled .logo img { height: 38px; max-width: 38px; }
            
            .logo-text .brand-name {
                font-size: 0.74rem;
                max-width: 140px;
            }
            header.scrolled .logo-text .brand-name { font-size: 0.7rem; }
            
            .logo-text .brand-sub { display: none; }
            
            .header-actions { gap: 0.25rem; }
            .icon-btn {
                width: 33px;
                height: 33px;
                font-size: 0.72rem;
                border-radius: 6px;
            }
            .lang-btn { width: 33px; height: 33px; }
            
            .hamburger { padding: 5px; gap: 4px; }
            .hamburger span { width: 18px; height: 2px; }
        }

        @media (max-width: 360px) {
            .logo img { height: 38px; max-width: 38px; }
            .logo-text .brand-name {
                font-size: 0.68rem;
                max-width: 110px;
            }
            .icon-btn { width: 30px; height: 30px; font-size: 0.68rem; }
        }

        /* =========================================
           MOBILE MENU
           ========================================= */
        .mobile-menu {
            display: none;
            position: fixed;
            top: var(--header-height);
            left: 0;
            right: 0;
            width: 100%;
            height: calc(100vh - var(--header-height));
            height: calc(100dvh - var(--header-height));
            background-color: var(--bg-secondary);
            z-index: 999;
            overflow-y: auto;
            -webkit-overflow-scrolling: touch;
            padding: 1.25rem 1.25rem;
            border-top: 1px solid var(--border-color);
            animation: slideDown 0.25s ease;
        }

        @keyframes slideDown {
            from { opacity: 0; transform: translateY(-10px); }
            to { opacity: 1; transform: translateY(0); }
        }

        .mobile-menu.active { display: block; }

        .mobile-menu ul {
            display: flex;
            flex-direction: column;
        }

        .mobile-menu ul li {
            border-bottom: 1px solid var(--border-color);
        }

        .mobile-menu ul li:last-child { border-bottom: none; }

        .mobile-menu ul li a {
            display: flex;
            align-items: center;
            justify-content: space-between;
            padding: 1.05rem 0.25rem;
            font-size: 0.98rem;
            color: var(--text-primary);
            transition: var(--transition);
            font-weight: 600;
        }

        .mobile-menu ul li a::after {
            content: '\f104';
            font-family: 'Font Awesome 6 Free';
            font-weight: 900;
            font-size: 0.7rem;
            opacity: 0.35;
        }

        body[dir="ltr"] .mobile-menu ul li a::after {
            content: '\f105';
        }

        .mobile-menu ul li a:hover {
            color: var(--brand-orange);
            padding-right: 6px;
        }

        body[dir="ltr"] .mobile-menu ul li a:hover {
            padding-right: 0.25rem;
            padding-left: 6px;
        }

        body.menu-open {
            overflow: hidden;
        }

        /* =========================================
           HERO SECTION
           ========================================= */
        .hero {
            position: relative;
            height: 100vh;
            height: 100dvh;
            min-height: 600px;
            display: flex;
            align-items: center;
            justify-content: center;
            text-align: center;
            overflow: hidden;
            padding-top: var(--header-height);
        }

        .hero-bg {
            position: absolute;
            top: 0;
            left: 0;
            width: 100%;
            height: 100%;
            object-fit: cover;
            z-index: -2;
        }

        .hero-overlay {
            position: absolute;
            top: 0;
            left: 0;
            width: 100%;
            height: 100%;
            background: linear-gradient(180deg, rgba(0, 0, 0, 0.82) 0%, rgba(0, 0, 0, 0.5) 50%, rgba(0, 0, 0, 0.9) 100%);
            z-index: -1;
        }

        .hero-content {
            max-width: 950px;
            padding: 0 1.5rem;
            color: #FFFFFF;
            animation: fadeInUp 0.9s ease;
            position: relative;
            z-index: 1;
        }

        .hero-badge {
            display: inline-flex;
            align-items: center;
            gap: 0.5rem;
            padding: 0.5rem 1.15rem;
            background: rgba(255, 255, 255, 0.08);
            border: 1px solid rgba(255, 255, 255, 0.2);
            border-radius: 50px;
            font-size: 0.78rem;
            font-weight: 600;
            color: #FFFFFF;
            margin-bottom: 1.75rem;
            letter-spacing: 0.4px;
        }

        .hero-badge i { font-size: 0.9rem; color: var(--brand-yellow); }

        .hero-content h1 {
            font-size: clamp(1.75rem, 5.5vw, 4.2rem);
            margin-bottom: 1.25rem;
            font-weight: 800;
            line-height: 1.15;
            color: #FFFFFF;
        }

        .hero-content p {
            font-size: clamp(0.9rem, 1.8vw, 1.15rem);
            margin-bottom: 2.5rem;
            opacity: 0.9;
            font-weight: 400;
            max-width: 700px;
            margin-left: auto;
            margin-right: auto;
            line-height: 1.8;
            color: #FFFFFF;
        }

        .hero-buttons {
            display: flex;
            gap: 0.75rem;
            justify-content: center;
            flex-wrap: wrap;
        }

        @media (max-width: 576px) {
            .hero { min-height: 540px; }
            .hero-content { padding: 0 1rem; }
            .hero-badge { font-size: 0.68rem; padding: 0.4rem 0.9rem; margin-bottom: 1.25rem; }
            .hero-buttons { flex-direction: column; align-items: stretch; gap: 0.6rem; }
            .hero-buttons .btn { width: 100%; }
        }

        @keyframes fadeInUp {
            from { opacity: 0; transform: translateY(30px); }
            to { opacity: 1; transform: translateY(0); }
        }

        /* =========================================
           STATS BAR
           ========================================= */
        .stats-bar {
            background: var(--bg-dark);
            padding: 2.25rem 0;
            position: relative;
        }

        .stats-grid {
            display: grid;
            grid-template-columns: repeat(4, 1fr);
            gap: 2rem;
        }

        .stat-item {
            text-align: center;
            padding: 0.75rem 0.5rem;
            border-left: 1px solid rgba(255, 255, 255, 0.08);
        }

        .stat-item:first-child { border-left: none; }

        body[dir="ltr"] .stat-item {
            border-left: none;
            border-right: 1px solid rgba(255, 255, 255, 0.08);
        }

        body[dir="ltr"] .stat-item:first-child { border-right: none; }

        .stat-item .stat-icon {
            font-size: 1.6rem;
            color: var(--brand-yellow);
            margin-bottom: 0.5rem;
        }

        .stat-item .stat-label {
            font-size: 0.82rem;
            color: var(--text-on-dark);
            font-weight: 600;
        }

        @media (max-width: 768px) {
            .stats-bar { padding: 1.5rem 0; }
            .stats-grid {
                grid-template-columns: repeat(2, 1fr);
                gap: 0.75rem;
            }
            .stat-item {
                border-left: none;
                border-bottom: 1px solid rgba(255, 255, 255, 0.08);
                padding: 0.6rem 0.25rem;
            }
            .stat-item:nth-child(3),
            .stat-item:nth-child(4) {
                border-bottom: none;
            }
            .stat-item .stat-icon { font-size: 1.4rem; }
            .stat-item .stat-label { font-size: 0.75rem; }
        }

        /* =========================================
           SECTORS / SERVICES
           ========================================= */
        .sectors-grid {
            display: grid;
            grid-template-columns: repeat(2, 1fr);
            gap: 1.5rem;
        }

        .sector-card {
            position: relative;
            padding: 2.25rem 1.75rem;
            background: var(--bg-secondary);
            border: 1px solid var(--border-color);
            border-radius: 12px;
            transition: var(--transition);
            box-shadow: var(--card-shadow);
        }

        .sector-card:hover {
            border-color: var(--accent-border);
            transform: translateY(-4px);
            box-shadow: var(--card-shadow-hover);
        }

        .sector-header {
            display: flex;
            align-items: center;
            gap: 1.15rem;
            margin-bottom: 1.35rem;
        }

        .sector-icon-wrap {
            width: 62px;
            height: 62px;
            display: flex;
            align-items: center;
            justify-content: center;
            background: var(--accent-light);
            border-radius: 12px;
            flex-shrink: 0;
            border: 1px solid var(--accent-border);
            transition: var(--transition);
        }

        .sector-card:hover .sector-icon-wrap { background: var(--brand-orange); }

        .sector-icon-wrap i {
            font-size: 1.7rem;
            color: var(--brand-orange);
            transition: var(--transition);
        }

        .sector-card:hover .sector-icon-wrap i { color: #FFFFFF; }

        .sector-title { min-width: 0; }

        .sector-title h3 {
            font-family: 'Cairo', sans-serif;
            font-size: 1.25rem;
            font-weight: 800;
            color: var(--text-primary);
            margin-bottom: 0.25rem;
            line-height: 1.3;
        }

        .sector-title .sector-en {
            font-family: 'Lato', sans-serif;
            font-size: 0.68rem;
            font-weight: 700;
            color: var(--brand-orange);
            letter-spacing: 1.2px;
            text-transform: uppercase;
        }

        .sector-desc {
            color: var(--text-secondary);
            font-size: 0.9rem;
            line-height: 1.75;
            margin-bottom: 1.15rem;
        }

        .sector-features {
            display: flex;
            flex-wrap: wrap;
            gap: 0.35rem;
        }

        .sector-features span {
            font-size: 0.7rem;
            padding: 0.3rem 0.75rem;
            background: var(--bg-tertiary);
            color: var(--text-secondary);
            border-radius: 20px;
            font-weight: 600;
            border: 1px solid var(--border-color);
            transition: var(--transition);
        }

        .sector-card:hover .sector-features span {
            border-color: var(--accent-border);
            color: var(--brand-orange);
        }

        @media (max-width: 992px) {
            .sectors-grid {
                grid-template-columns: 1fr;
                gap: 1.1rem;
            }
        }

        @media (max-width: 576px) {
            .sector-card { padding: 1.6rem 1.15rem; }
            .sector-icon-wrap {
                width: 52px;
                height: 52px;
                border-radius: 10px;
            }
            .sector-icon-wrap i { font-size: 1.4rem; }
            .sector-title h3 { font-size: 1.1rem; }
            .sector-desc { font-size: 0.85rem; }
            .sector-header {
                gap: 0.8rem;
                margin-bottom: 1rem;
            }
        }

        /* =========================================
           ABOUT SECTION
           ========================================= */
        .about-grid {
            display: grid;
            grid-template-columns: 1fr 1fr;
            gap: 3.5rem;
            align-items: center;
        }

        .about-image {
            position: relative;
            height: 480px;
            overflow: hidden;
            border-radius: 12px;
            box-shadow: var(--card-shadow);
        }

        .about-image img {
            width: 100%;
            height: 100%;
            object-fit: cover;
        }

        .about-text h2 { margin-bottom: 0.5rem; }
        .about-text .gold-line { margin-bottom: 1.5rem; }

        .about-text p {
            color: var(--text-secondary);
            margin-bottom: 1.15rem;
            font-size: 0.95rem;
            line-height: 1.85;
        }

        @media (max-width: 992px) {
            .about-grid {
                grid-template-columns: 1fr;
                gap: 2rem;
            }
            .about-image { height: 340px; }
        }

        @media (max-width: 576px) {
            .about-image { height: 260px; }
            .about-text p { font-size: 0.9rem; }
        }

        /* =========================================
           VISION / MISSION / VALUES
           ========================================= */
        .vmv-grid {
            display: grid;
            grid-template-columns: repeat(3, 1fr);
            gap: 1.25rem;
        }

        .vmv-card {
            background: var(--bg-secondary);
            padding: 2.25rem 1.6rem;
            border: 1px solid var(--border-color);
            transition: var(--transition);
            text-align: center;
            border-radius: 12px;
            box-shadow: var(--card-shadow);
        }

        .vmv-card:hover {
            border-color: var(--accent-border);
            transform: translateY(-4px);
            box-shadow: var(--card-shadow-hover);
        }

        .vmv-icon-wrap {
            width: 62px;
            height: 62px;
            display: flex;
            align-items: center;
            justify-content: center;
            background: var(--accent-light);
            border-radius: 50%;
            margin: 0 auto 1.35rem;
            border: 1px solid var(--accent-border);
            transition: var(--transition);
        }

        .vmv-card:hover .vmv-icon-wrap { background: var(--brand-orange); }

        .vmv-icon-wrap i {
            font-size: 1.6rem;
            color: var(--brand-orange);
            transition: var(--transition);
        }

        .vmv-card:hover .vmv-icon-wrap i { color: #FFFFFF; }

        .vmv-card h3 {
            font-family: 'Cairo', sans-serif;
            font-size: 1.2rem;
            margin-bottom: 0.85rem;
            color: var(--text-primary);
            font-weight: 800;
        }

        .vmv-card p {
            color: var(--text-secondary);
            font-size: 0.9rem;
            line-height: 1.8;
        }

        .values-list {
            display: flex;
            flex-wrap: wrap;
            gap: 0.4rem;
            justify-content: center;
            margin-top: 1.15rem;
        }

        .values-list span {
            background-color: var(--bg-tertiary);
            padding: 0.35rem 0.85rem;
            border-radius: 20px;
            font-size: 0.75rem;
            color: var(--text-primary);
            border: 1px solid var(--border-color);
            transition: var(--transition);
            font-weight: 600;
        }

        .values-list span:hover {
            border-color: var(--brand-orange);
            color: var(--brand-orange);
            background-color: var(--accent-light);
        }

        @media (max-width: 992px) {
            .vmv-grid { grid-template-columns: 1fr; gap: 1.1rem; }
        }

        /* =========================================
           HOW WE WORK
           ========================================= */
        .how-work-grid {
            display: grid;
            grid-template-columns: repeat(4, 1fr);
            gap: 1.1rem;
        }

        .work-step {
            position: relative;
            padding: 1.85rem 1.35rem;
            border-radius: 12px;
            background: var(--bg-secondary);
            border: 1px solid var(--border-color);
            transition: var(--transition);
            text-align: center;
            box-shadow: var(--card-shadow);
        }

        .work-step:hover {
            border-color: var(--accent-border);
            transform: translateY(-4px);
            box-shadow: var(--card-shadow-hover);
        }

        .work-step-icon {
            width: 52px;
            height: 52px;
            display: flex;
            align-items: center;
            justify-content: center;
            background: var(--accent-light);
            border-radius: 50%;
            margin: 0 auto 0.9rem;
            border: 1px solid var(--accent-border);
            transition: var(--transition);
        }

        .work-step:hover .work-step-icon { background: var(--brand-orange); }

        .work-step-icon i {
            font-size: 1.25rem;
            color: var(--brand-orange);
            transition: var(--transition);
        }

        .work-step:hover .work-step-icon i { color: #FFFFFF; }

        .work-step .step-number {
            font-family: 'Cormorant Garamond', serif;
            font-size: 2.2rem;
            font-weight: 800;
            color: var(--brand-orange);
            line-height: 1;
            margin-bottom: 0.5rem;
        }

        .work-step h4 {
            font-family: 'Cairo', sans-serif;
            font-size: 0.95rem;
            margin-bottom: 0.5rem;
            color: var(--text-primary);
            font-weight: 800;
        }

        .work-step p {
            font-size: 0.8rem;
            color: var(--text-secondary);
            line-height: 1.7;
        }

        @media (max-width: 992px) {
            .how-work-grid {
                grid-template-columns: repeat(2, 1fr);
                gap: 0.9rem;
            }
        }

        @media (max-width: 576px) {
            .how-work-grid {
                grid-template-columns: 1fr;
                gap: 0.8rem;
            }
            .work-step { padding: 1.6rem 1.15rem; }
        }

        /* =========================================
           GALLERY
           ========================================= */
        .gallery-grid {
            display: grid;
            grid-template-columns: repeat(3, 1fr);
            gap: 0.9rem;
        }

        .gallery-item {
            position: relative;
            overflow: hidden;
            border-radius: 10px;
            aspect-ratio: 4 / 3;
            cursor: pointer;
            border: 1px solid var(--border-color);
            transition: var(--transition);
            -webkit-tap-highlight-color: transparent;
        }

        .gallery-item img {
            width: 100%;
            height: 100%;
            object-fit: cover;
            transition: transform 0.6s ease;
        }

        .gallery-item:hover img { transform: scale(1.06); }

        .gallery-item:hover {
            border-color: var(--brand-orange);
            box-shadow: var(--card-shadow-hover);
        }

        @media (max-width: 992px) {
            .gallery-grid { grid-template-columns: repeat(2, 1fr); }
        }

        @media (max-width: 576px) {
            .gallery-grid {
                grid-template-columns: repeat(2, 1fr);
                gap: 0.55rem;
            }
            .gallery-item { border-radius: 8px; }
        }

        /* =========================================
           PRESENCE
           ========================================= */
        .presence-grid {
            display: grid;
            grid-template-columns: 1fr;
            gap: 1.25rem;
            max-width: 700px;
            margin: 0 auto;
        }

        .presence-card {
            background-color: var(--bg-secondary);
            border: 1px solid var(--border-color);
            overflow: hidden;
            transition: var(--transition);
            border-radius: 12px;
            box-shadow: var(--card-shadow);
        }

        .presence-card:hover {
            border-color: var(--accent-border);
            transform: translateY(-4px);
            box-shadow: var(--card-shadow-hover);
        }

        .presence-card .presence-info {
            padding: 2.25rem 1.6rem;
            text-align: center;
        }

        .presence-card .presence-icon {
            width: 70px;
            height: 70px;
            display: flex;
            align-items: center;
            justify-content: center;
            background: var(--logo-sun-gradient);
            border-radius: 50%;
            margin: 0 auto 1.15rem;
        }

        .presence-card .presence-icon i {
            font-size: 1.9rem;
            color: var(--logo-black);
        }

        .presence-card .presence-info h3 {
            font-family: 'Cairo', sans-serif;
            font-size: 1.4rem;
            margin-bottom: 0.35rem;
            color: var(--text-primary);
            font-weight: 800;
        }

        .presence-card .presence-info .sub {
            font-size: 0.68rem;
            color: var(--brand-orange);
            text-transform: uppercase;
            letter-spacing: 2.2px;
            margin-bottom: 0.9rem;
            font-weight: 800;
        }

        .presence-card .presence-info p {
            font-size: 0.92rem;
            color: var(--text-secondary);
            line-height: 1.8;
        }

        /* =========================================
           WORK DETAILS (removed hours)
           ========================================= */
        .details-grid {
            display: grid;
            grid-template-columns: repeat(2, 1fr);
            gap: 1.1rem;
            max-width: 800px;
            margin: 0 auto;
        }

        .detail-item {
            padding: 1.85rem 1.35rem;
            border: 1px solid var(--border-color);
            background-color: var(--bg-secondary);
            transition: var(--transition);
            border-radius: 12px;
            box-shadow: var(--card-shadow);
            text-align: center;
        }

        .detail-item:hover {
            border-color: var(--accent-border);
            transform: translateY(-4px);
            box-shadow: var(--card-shadow-hover);
        }

        .detail-icon-wrap {
            width: 54px;
            height: 54px;
            display: flex;
            align-items: center;
            justify-content: center;
            background: var(--accent-light);
            border-radius: 50%;
            margin: 0 auto 0.9rem;
            border: 1px solid var(--accent-border);
            transition: var(--transition);
        }

        .detail-item:hover .detail-icon-wrap { background: var(--brand-orange); }

        .detail-icon-wrap i {
            font-size: 1.25rem;
            color: var(--brand-orange);
            transition: var(--transition);
        }

        .detail-item:hover .detail-icon-wrap i { color: #FFFFFF; }

        .detail-item h4 {
            font-family: 'Cairo', sans-serif;
            font-size: 1rem;
            margin-bottom: 0.5rem;
            color: var(--text-primary);
            font-weight: 800;
        }

        .detail-item p {
            font-size: 0.82rem;
            color: var(--text-secondary);
            line-height: 1.7;
        }

        @media (max-width: 768px) {
            .details-grid {
                grid-template-columns: 1fr;
                gap: 0.8rem;
            }
            .detail-item { padding: 1.6rem 1.15rem; }
        }

        /* =========================================
           CONTACT SECTION
           ========================================= */
        .contact-section {
            background-color: var(--bg-secondary);
            text-align: center;
            position: relative;
        }

        .contact-section h2 {
            font-size: clamp(1.5rem, 4.5vw, 2.8rem);
            margin-bottom: 0.85rem;
            color: var(--text-primary);
            font-weight: 800;
        }

        .contact-section > .container > p {
            color: var(--text-secondary);
            margin-bottom: 2.25rem;
            font-size: 0.92rem;
        }

        .contact-grid {
            display: grid;
            grid-template-columns: 1fr;
            gap: 1.1rem;
            margin-bottom: 2.25rem;
            max-width: 480px;
            margin-left: auto;
            margin-right: auto;
        }

        .contact-card {
            background: var(--bg-tertiary);
            border: 1px solid var(--border-color);
            padding: 1.85rem 1.35rem;
            border-radius: 12px;
            transition: var(--transition);
        }

        .contact-card:hover {
            border-color: var(--accent-border);
            box-shadow: var(--card-shadow-hover);
        }

        .contact-card .contact-icon {
            font-size: 1.5rem;
            color: #FFFFFF;
            margin-bottom: 0.9rem;
            width: 58px;
            height: 58px;
            display: flex;
            align-items: center;
            justify-content: center;
            background: var(--logo-sun-gradient);
            border-radius: 50%;
            margin-left: auto;
            margin-right: auto;
        }

        .contact-card .contact-number {
            font-size: 1.3rem;
            font-weight: 800;
            color: var(--text-primary);
            margin-bottom: 1.15rem;
            font-family: 'Lato', sans-serif;
            letter-spacing: 0.5px;
            direction: ltr;
        }

        .contact-card .contact-buttons {
            display: flex;
            gap: 0.55rem;
            justify-content: center;
            flex-wrap: wrap;
        }

        .contact-card .contact-buttons .btn {
            padding: 0.65rem 1.15rem;
            font-size: 0.8rem;
        }

        .contact-location { margin-top: 0.85rem; }

        .contact-location a {
            display: inline-flex;
            align-items: center;
            gap: 0.6rem;
            padding: 0.85rem 1.85rem;
            background: var(--brand-orange);
            color: #FFFFFF;
            border-radius: 6px;
            font-size: 0.85rem;
            transition: var(--transition);
            font-weight: 700;
            max-width: 100%;
        }

        .contact-location a:hover {
            background: var(--accent-hover);
            transform: translateY(-1px);
        }

        .contact-location a i { font-size: 1rem; }

        @media (max-width: 576px) {
            .contact-card { padding: 1.6rem 1.15rem; }
            .contact-card .contact-number { font-size: 1.15rem; }
            .contact-card .contact-buttons {
                flex-direction: column;
                align-items: stretch;
            }
            .contact-card .contact-buttons .btn { width: 100%; }
            .contact-location a {
                padding: 0.8rem 1.4rem;
                font-size: 0.8rem;
            }
        }

        /* =========================================
           FOOTER
           ========================================= */
        footer {
            background: var(--bg-dark);
            color: var(--text-on-dark-secondary);
            padding: 3.5rem 0 1.5rem;
            position: relative;
        }

        [data-theme="dark"] footer { background: var(--bg-dark-secondary); }

        .footer-grid {
            display: grid;
            grid-template-columns: 2fr 1fr 1fr;
            gap: 2.25rem;
            margin-bottom: 2.25rem;
        }

        .footer-brand .logo-placeholder {
            font-family: 'Cairo', sans-serif;
            font-size: 1.1rem;
            font-weight: 800;
            color: #FFFFFF;
            letter-spacing: 0.3px;
            margin-bottom: 0.4rem;
            line-height: 1.4;
        }

        .footer-brand .footer-sub {
            font-family: 'Lato', sans-serif;
            font-size: 0.68rem;
            font-weight: 700;
            color: var(--brand-yellow);
            letter-spacing: 1.8px;
            margin-bottom: 0.9rem;
        }

        .footer-brand p {
            font-size: 0.86rem;
            opacity: 0.8;
            line-height: 1.8;
            max-width: 380px;
        }

        .footer-links h4 {
            color: #FFFFFF;
            font-size: 0.98rem;
            margin-bottom: 1.15rem;
            position: relative;
            padding-bottom: 0.55rem;
            font-weight: 800;
            font-family: 'Cairo', sans-serif;
        }

        .footer-links h4::after {
            content: '';
            position: absolute;
            bottom: 0;
            right: 0;
            width: 28px;
            height: 2px;
            background: var(--brand-orange);
            border-radius: 2px;
        }

        body[dir="ltr"] .footer-links h4::after {
            right: auto;
            left: 0;
        }

        .footer-links ul li { margin-bottom: 0.65rem; }

        .footer-links ul li a {
            font-size: 0.85rem;
            opacity: 0.75;
            transition: var(--transition);
            display: inline-block;
            color: var(--text-on-dark-secondary);
        }

        .footer-links ul li a:hover {
            color: var(--brand-yellow);
            opacity: 1;
        }

        .footer-bottom {
            border-top: 1px solid rgba(255,255,255,0.07);
            padding-top: 1.5rem;
            text-align: center;
            font-size: 0.8rem;
            opacity: 0.65;
            line-height: 1.6;
        }

        @media (max-width: 992px) {
            .footer-grid {
                grid-template-columns: 1fr 1fr;
                gap: 1.75rem;
            }
        }

        @media (max-width: 576px) {
            .footer-grid {
                grid-template-columns: 1fr;
                gap: 1.5rem;
            }
            .footer-brand p { max-width: 100%; }
            footer { padding: 2.75rem 0 1.25rem; }
        }

        /* =========================================
           REVEAL ANIMATIONS
           ========================================= */
        .reveal {
            opacity: 0;
            transform: translateY(24px);
            transition: opacity 0.7s ease, transform 0.7s ease;
        }

        .reveal.active {
            opacity: 1;
            transform: translateY(0);
        }

        @media (prefers-reduced-motion: reduce) {
            .reveal {
                opacity: 1;
                transform: none;
                transition: none;
            }
            html { scroll-behavior: auto; }
        }

        /* =========================================
           SCROLLBAR
           ========================================= */
        ::-webkit-scrollbar { width: 8px; }
        ::-webkit-scrollbar-track { background: var(--bg-primary); }
        ::-webkit-scrollbar-thumb {
            background: var(--border-color);
            border-radius: 4px;
        }
        ::-webkit-scrollbar-thumb:hover { background: var(--brand-orange); }

        @media (max-width: 768px) {
            ::-webkit-scrollbar { width: 5px; }
        }
    </style>
</head>
<body>

    <header id="mainHeader">
        <div class="container header-inner">
            <a href="#home" class="logo" id="headerLogo"></a>
            <nav class="nav-links" id="desktopNav"></nav>
            <div class="header-actions">
                <button class="icon-btn lang-btn" id="langToggle" aria-label="Toggle Language">
                    <i class="fas fa-globe"></i> <span>EN</span>
                </button>
                <button class="icon-btn" id="themeToggle" aria-label="Toggle Theme">
                    <i class="fas fa-moon"></i>
                </button>
                <button class="hamburger" id="mobileMenuBtn" aria-label="Menu" aria-expanded="false">
                    <span></span><span></span><span></span>
                </button>
            </div>
        </div>
    </header>

    <div class="mobile-menu" id="mobileMenu">
        <ul id="mobileNavList"></ul>
    </div>

    <section class="hero" id="home">
        <img src="j1.jpeg" alt="Hero" class="hero-bg" id="heroBg">
        <div class="hero-overlay"></div>
        <div class="hero-content">
            <div class="hero-badge">
                <i class="fas fa-industry"></i>
                <span id="heroBadge"></span>
            </div>
            <h1 id="heroTitle"></h1>
            <p id="heroDesc"></p>
            <div class="hero-buttons">
                <a href="#sectors" class="btn btn-primary" id="heroBtn1"></a>
                <a href="#contact" class="btn btn-outline-light" id="heroBtn2"></a>
            </div>
        </div>
    </section>

    <section class="stats-bar">
        <div class="container">
            <div class="stats-grid" id="statsGrid"></div>
        </div>
    </section>

    <section class="section-padding" id="sectors">
        <div class="container">
            <h2 class="section-title reveal" id="sectorsTitle"></h2>
            <div class="gold-line reveal"></div>
            <p class="section-subtitle reveal" id="sectorsSubtitle"></p>
            <div class="sectors-grid" id="sectorsGrid"></div>
        </div>
    </section>

    <section class="section-padding" style="background-color: var(--bg-tertiary);" id="about">
        <div class="container">
            <div class="about-grid">
                <div class="about-image reveal">
                    <img src="j2.jpeg" alt="About" id="aboutImg">
                </div>
                <div class="about-text reveal">
                    <h2 class="section-title" id="aboutTitle"></h2>
                    <div class="gold-line"></div>
                    <p id="aboutP1"></p>
                    <p id="aboutP2"></p>
                </div>
            </div>
        </div>
    </section>

    <section class="section-padding" id="vmv">
        <div class="container">
            <div class="vmv-grid">
                <div class="vmv-card reveal">
                    <div class="vmv-icon-wrap"><i class="fas fa-eye"></i></div>
                    <h3 id="visionTitle"></h3>
                    <p id="visionText"></p>
                </div>
                <div class="vmv-card reveal">
                    <div class="vmv-icon-wrap"><i class="fas fa-bullseye"></i></div>
                    <h3 id="missionTitle"></h3>
                    <p id="missionText"></p>
                </div>
                <div class="vmv-card reveal">
                    <div class="vmv-icon-wrap"><i class="fas fa-gem"></i></div>
                    <h3 id="valuesTitle"></h3>
                    <div class="values-list" id="valuesList"></div>
                </div>
            </div>
        </div>
    </section>

    <section class="section-padding" style="background-color: var(--bg-tertiary);" id="how-we-work">
        <div class="container">
            <h2 class="section-title reveal" id="howTitle"></h2>
            <div class="gold-line reveal"></div>
            <p class="section-subtitle reveal" id="howSubtitle"></p>
            <div class="how-work-grid">
                <div class="work-step reveal">
                    <div class="work-step-icon"><i class="fas fa-clipboard-list"></i></div>
                    <div class="step-number">01</div>
                    <h4 id="step1Title"></h4>
                    <p id="step1Desc"></p>
                </div>
                <div class="work-step reveal">
                    <div class="work-step-icon"><i class="fas fa-ruler-combined"></i></div>
                    <div class="step-number">02</div>
                    <h4 id="step2Title"></h4>
                    <p id="step2Desc"></p>
                </div>
                <div class="work-step reveal">

        function initMobileMenu() {
            const menuBtn = document.getElementById('mobileMenuBtn');
            const mobileMenu = document.getElementById('mobileMenu');
            const body = document.body;
            
            function closeMenu() {
                mobileMenu.classList.remove('active');
                body.classList.remove('menu-open');
                menuBtn.setAttribute('aria-expanded', 'false');
                const spans = menuBtn.querySelectorAll('span');
                spans[0].style.transform = 'none';
                spans[1].style.opacity = '1';
                spans[2].style.transform = 'none';
            }
            
            function openMenu() {
                mobileMenu.classList.add('active');
                body.classList.add('menu-open');
                menuBtn.setAttribute('aria-expanded', 'true');
                const spans = menuBtn.querySelectorAll('span');
                spans[0].style.transform = 'rotate(45deg) translate(5px, 5px)';
                spans[1].style.opacity = '0';
                spans[2].style.transform = 'rotate(-45deg) translate(5px, -5px)';
            }
            
            menuBtn.addEventListener('click', () => {
                mobileMenu.classList.contains('active') ? closeMenu() : openMenu();
            });

            mobileMenu.addEventListener('click', (e) => {
                if (e.target.tagName === 'A' || e.target.closest('a')) closeMenu();
            });
            
            document.addEventListener('keydown', (e) => {
                if (e.key === 'Escape' && mobileMenu.classList.contains('active')) closeMenu();
            });
            
            window._closeMobileMenu = closeMenu;
        }

        function initScrollReveal() {
            const reveals = document.querySelectorAll('.reveal:not(.active)');
            if (!('IntersectionObserver' in window)) {
                reveals.forEach(el => el.classList.add('active'));
                return;
            }
            const revealObserver = new IntersectionObserver((entries) => {
                entries.forEach(entry => {
                    if (entry.isIntersecting) {
                        entry.target.classList.add('active');
                        revealObserver.unobserve(entry.target);
                    }
                });
            }, { threshold: 0.08, rootMargin: '0px 0px -20px 0px' });
            reveals.forEach(reveal => revealObserver.observe(reveal));
        }

                anchor.addEventListener('click', function(e) {

                    e.preventDefault();
                    const target = document.querySelector(href);
                    if (target) {
                        const header = document.getElementById('mainHeader');
                        const headerHeight = header ? header.offsetHeight : 70;
                        const elementPosition = target.getBoundingClientRect().top;
                        const offsetPosition = elementPosition + window.pageYOffset - headerHeight - 8;
                        window.scrollTo({ top: offsetPosition, behavior: 'smooth' });
                    }
                });
            });
        }

        function initHeaderScroll() {
            const header = document.getElementById('mainHeader');
            let ticking = false;
            window.addEventListener('scroll', () => {
                if (!ticking) {
                    window.requestAnimationFrame(() => {
                        header.classList.toggle('scrolled', window.scrollY > 30);
                        ticking = false;
                    });
                    ticking = true;
                }
            }, { passive: true });
        }

        document.getElementById('themeToggle').addEventListener('click', toggleTheme);
        document.getElementById('langToggle').addEventListener('click', toggleLanguage);

        window.addEventListener('resize', () => {
            if (window.innerWidth > 992 && window._closeMobileMenu) window._closeMobileMenu();
        });
    </script>
</body>
</html>
